name: Deploy Edge Functions

# Pushing to main deploys the Edge Functions that push actually changed.
#
# ── Why this exists ──────────────────────────────────────────────────────────
# Every Edge Function deploy was hand-assembled before this: one Management API
# call per function carrying the entrypoint and every shared module it imports as
# literal text. Two of them grew past what a single call can carry and could not
# be shipped at all, which left the repository and the live project disagreeing.
# A push is a deploy now, and that class of problem goes away.
#
# ── What it will not do ──────────────────────────────────────────────────────
# It does not run migrations. `supabase db push` on every merge is a different and
# much larger promise: a migration can be irreversible, and it should be somebody
# deciding, not a side effect of a merge. Keep running those by hand.
#
# It does not deploy rr-report or admin-users. Those serve the live Reynolds and
# Reynolds system, admin-users has no source in this repository, and neither is
# developed here. scripts/changed-edge-functions.mjs excludes them by name.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch:
    inputs:
      functions:
        description: >-
          Space-separated function names to deploy, or "all" for every function
          this workflow is allowed to touch. Leave blank to deploy nothing.
        required: false
        default: ""

concurrency:
  # One deploy at a time. Two overlapping runs can land in either order, and the
  # loser silently wins.
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Forks do not hold the token and must not deploy to this project even if
    # they somehow did.
    if: github.repository == 'jimrstout/docuride-ps'

    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to diff against the previous commit on a push.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the token is present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Add it under" \
                 "Settings, Secrets and variables, Actions. Generate one at" \
                 "https://supabase.com/dashboard/account/tokens"
            exit 1
          fi

      # The same checks a contributor runs. A deploy that ships code the tests
      # reject is worse than no deploy: the repository still looks green.
      - run: npm ci
      - name: Type-check the Vercel side
        run: npx tsc --noEmit
      - name: Tests
        run: npm test

      - name: Work out which functions to deploy
        id: pick
        env:
          MODE: ${{ github.event_name }}
          REQUESTED: ${{ github.event.inputs.functions }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$MODE" = "workflow_dispatch" ]; then
            if [ "${REQUESTED}" = "all" ]; then
              # Every function this workflow may touch, exclusions applied.
              SLUGS=$(node -e '
                import("./scripts/changed-edge-functions.mjs").then((m) => {
                  console.log(
                    m.functionSlugs().filter((s) => !m.NEVER_DEPLOY.has(s)).join("\n")
                  );
                });
              ')
            else
              SLUGS=$(printf "%s" "${REQUESTED}" | tr " " "\n" | sed "/^$/d")
            fi
          else
            # Everything this push touched, including shared modules, resolved
            # through each function's import graph.
            # BEFORE is all-zeros on a branch's first push, so fall back.
            if ! git diff --name-only "$BEFORE" "$SHA" > /tmp/changed.txt 2>/dev/null; then
              git diff --name-only HEAD~1 HEAD > /tmp/changed.txt
            fi
            echo "Changed files:"
            sed "s/^/  /" /tmp/changed.txt
            SLUGS=$(node scripts/changed-edge-functions.mjs - < /tmp/changed.txt)
          fi

          # Refuse a name this workflow must not deploy, rather than skipping it
          # quietly: somebody asked for it and needs to be told no.
          BLOCKED=$(node -e '
            import("./scripts/changed-edge-functions.mjs").then((m) => {
              console.log([...m.NEVER_DEPLOY].join("|"));
            });
          ')
          for slug in $SLUGS; do
            if echo "$slug" | grep -qE "^(${BLOCKED})$"; then
              echo "::error::${slug} is not deployed from this repository. It serves" \
                   "the live Reynolds and Reynolds system."
              exit 1
            fi
          done

          {
            echo "slugs<<EOF"
            echo "$SLUGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -z "$SLUGS" ]; then
            echo "Nothing to deploy."
          else
            echo "Will deploy:"
            echo "$SLUGS" | sed "s/^/  /"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.pick.outputs.slugs != ''
        with:
          version: latest

      - name: Deploy
        if: steps.pick.outputs.slugs != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: fovccigwlcmmzfubpfny
          # Through the environment, never interpolated into the script body.
          SLUGS: ${{ steps.pick.outputs.slugs }}
        run: |
          set -euo pipefail
          failed=""
          # `[ -z "$x" ] && continue` would exit here: under `set -e` a
          # short-circuited && list returns 1, and that is the loop body's status.
          while read -r slug; do
            if [ -n "$slug" ]; then
              echo "-- $slug --"
              # No --no-verify-jwt flag anywhere. verify_jwt comes from
              # supabase/config.toml, which names every function precisely so
              # that the CLI's default of true cannot be applied by omission.
              if supabase functions deploy "$slug" --project-ref "$PROJECT_REF"; then
                echo "$slug deployed"
              else
                echo "::error::$slug failed to deploy"
                failed="$failed $slug"
              fi
            fi
          done <<< "$SLUGS"

          if [ -n "$failed" ]; then
            echo "::error::Failed:$failed"
            exit 1
          fi

      - name: Smoke-test each deployed function
        if: steps.pick.outputs.slugs != ''
        env:
          PROJECT_REF: fovccigwlcmmzfubpfny
          SLUGS: ${{ steps.pick.outputs.slugs }}
        run: |
          set -uo pipefail
          # A wrong secret must come back 401. That is a real check, not a
          # formality: the handler only reaches its auth check once the bundle has
          # parsed and every shared module has resolved, so a 401 proves the
          # deploy is sound in the one way a deploy can silently fail.
          #
          # Anything else is reported and does not fail the run: some functions
          # are GET-only or answer 405 first, and this is an assurance step rather
          # than the gate.
          while read -r slug; do
            if [ -n "$slug" ]; then
              code=$(curl -s -o /tmp/body -w "%{http_code}" -X POST \
                "https://${PROJECT_REF}.supabase.co/functions/v1/${slug}?secret=deliberately-wrong" \
                -H "Content-Type: application/json" -d '{}' || echo "000")
              if [ "$code" = "401" ]; then
                echo "  $slug  401, bundle parses and its modules resolve"
              else
                echo "  $slug  $code  $(head -c 200 /tmp/body)"
                if [ "$code" = "500" ] || [ "$code" = "503" ] || [ "$code" = "000" ]; then
                  echo "::warning::$slug answered $code. Check the function logs."
                fi
              fi
            fi
          done <<< "$SLUGS"
