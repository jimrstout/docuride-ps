# ── verify_jwt, and why every function is listed ─────────────────────────────
#
# `supabase functions deploy` sets verify_jwt from this file, and its DEFAULT IS
# TRUE. A function missing from here is therefore not "left alone" by a CLI
# deploy: it is switched to requiring a Supabase JWT, and every caller that
# authenticates some other way starts getting 401 before the handler runs.
#
# Thirteen of these were missing. Every one of them authenticates with
# FNI_WEBHOOK_SECRET, so the first CLI deploy of any of them would have taken the
# Verify screen, the planner, the CRM button and both cron jobs off the air at
# once. Nothing had broken yet only because every deploy so far went through the
# Management API, which leaves the existing setting alone.
#
# So the rule is: every function that exists has a line here, whichever value it
# needs, and test/edge-function-config.test.mjs fails the build if one is added
# without one. The values below were read off the live project on 2026-09-27, not
# assumed.
#
# Why false is right for these: Zoho's webhook builder cannot attach a Supabase
# JWT, the pg_cron sweepers call in over pg_net, and the planner and console call
# through a server-side shared secret. Each function checks that secret itself
# before doing anything.

# ── R&R, and the live Reynolds and Reynolds system ──────────────────────────
# These two predate DocuRide PS and are the only functions here that DO verify a
# JWT. They are excluded from CI deploys outright -- see
# .github/workflows/deploy-edge-functions.yml -- because this repo is not where
# they are developed. admin-users has no source in this repo at all.
[functions.rr-report]
verify_jwt = true

# ── Zoho sync ───────────────────────────────────────────────────────────────
[functions.zoho-sync]
verify_jwt = false

[functions.zoho-backfill]
